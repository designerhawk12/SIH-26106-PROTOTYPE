openapi: 3.1.0
info:
  title: Email Threat Detection and Forensic Intelligence API
  version: 1.0.0
  description: >-
    Contract-only API. Email content is hostile data. Infrastructure geolocation
    describes observed routing infrastructure and never the physical location of
    an attacker.
servers:
  - url: http://localhost:8000
tags:
  - name: Cases
  - name: System
paths:
  /api/v1/cases/analyze:
    post:
      tags: [Cases]
      operationId: analyzeCase
      summary: Validate and analyze one RFC 5322 email
      description: >-
        The server must enforce MAX_UPLOAD_BYTES before parsing, reject invalid
        uploads, never execute attachments, and never visit extracted URLs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: RFC 5322 message; accepted as message/rfc822 or application/octet-stream.
      responses:
        "201":
          description: Analysis created; optional provider failures may produce PARTIAL status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeCaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: List stored analysis cases
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Paginated case summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cases/{case_id}:
    get:
      tags: [Cases]
      operationId: getCase
      summary: Get a complete analysis case
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Complete or partial normalized analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAnalysis"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/cases/{case_id}/report:
    get:
      tags: [Cases]
      operationId: getCaseReport
      summary: Download an inert forensic PDF report
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Generated forensic report.
          headers:
            Content-Disposition:
              schema: {type: string}
              description: Uses a server-generated safe filename.
          content:
            application/pdf:
              schema: {type: string, format: binary}
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Analysis is not ready for reporting.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/health:
    get:
      tags: [System]
      operationId: healthCheck
      summary: Return process health without exposing secrets
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}
components:
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Malformed or invalid email upload.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PayloadTooLarge:
      description: Upload exceeds the configured maximum size.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    UnsupportedMediaType:
      description: Upload media type is not accepted.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: Case does not exist.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    InternalError:
      description: Sanitized internal failure; no secrets are returned.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    AuthenticationVerdict:
      type: string
      enum: [PASS, FAIL, SOFTFAIL, NEUTRAL, TEMPERROR, PERMERROR, NONE, UNKNOWN]
    IOCType:
      type: string
      enum: [IP_ADDRESS, URL, DOMAIN, EMAIL_ADDRESS, ATTACHMENT_SHA256]
    IOCSource:
      type: string
      enum: [HEADER, BODY_TEXT, BODY_HTML, RECEIVED_HEADER, ATTACHMENT_METADATA]
    DetectionCategory:
      type: string
      enum: [PHISHING, SOCIAL_ENGINEERING, URGENCY, CREDENTIAL_REQUEST, PAYMENT_REQUEST, IMPERSONATION, BUSINESS_EMAIL_COMPROMISE, SUSPICIOUS_CALL_TO_ACTION]
    Severity:
      type: string
      enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
    ReputationVerdict:
      type: string
      description: Missing or failed enrichment is UNKNOWN, never BENIGN.
      enum: [MALICIOUS, SUSPICIOUS, BENIGN, UNKNOWN]
    EnrichmentStatus:
      type: string
      enum: [COMPLETE, PARTIAL, UNAVAILABLE, UNKNOWN]
    GeoLocationStatus:
      type: string
      enum: [FOUND, NOT_FOUND, NOT_PUBLIC, PROVIDER_ERROR, UNKNOWN]
    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    AnalysisStatus:
      type: string
      enum: [RECEIVED, PROCESSING, COMPLETED, PARTIAL, FAILED]
    TimelineEventType:
      type: string
      enum: [MESSAGE_DATE, RECEIVED_HOP, ANALYSIS_STARTED, ANALYSIS_COMPLETED, ENRICHMENT, FINDING]
    MailboxAddress:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        display_name: {type: [string, "null"]}
        address: {type: string}
    AuthenticationResults:
      type: object
      additionalProperties: false
      required: [spf, dkim, dmarc, dkim_domains, source_headers]
      properties:
        spf: {$ref: "#/components/schemas/AuthenticationVerdict"}
        dkim: {$ref: "#/components/schemas/AuthenticationVerdict"}
        dmarc: {$ref: "#/components/schemas/AuthenticationVerdict"}
        spf_domain: {type: [string, "null"]}
        dkim_domains: {type: array, items: {type: string}}
        dmarc_policy: {type: [string, "null"]}
        source_headers:
          type: array
          items: {type: string}
          description: Untrusted Authentication-Results values.
    ReceivedHop:
      type: object
      additionalProperties: false
      required: [position, raw_header, is_public_ip]
      properties:
        position: {type: integer, minimum: 0}
        raw_header: {type: string, description: Untrusted header evidence.}
        from_host: {type: [string, "null"]}
        by_host: {type: [string, "null"]}
        protocol: {type: [string, "null"]}
        message_id: {type: [string, "null"]}
        envelope_for: {type: [string, "null"]}
        timestamp: {type: [string, "null"], format: date-time}
        source_ip: {type: [string, "null"]}
        is_public_ip: {type: boolean}
    ExtractedIOC:
      type: object
      additionalProperties: false
      required: [type, value, normalized_value, source, occurrences]
      properties:
        type: {$ref: "#/components/schemas/IOCType"}
        value: {type: string, description: Exact hostile input; never auto-visit URLs.}
        normalized_value: {type: string}
        source: {$ref: "#/components/schemas/IOCSource"}
        occurrences: {type: integer, minimum: 1}
    MimePart:
      type: object
      additionalProperties: false
      required: [part_id, content_type]
      properties:
        part_id: {type: string}
        parent_part_id: {type: [string, "null"]}
        content_type: {type: string}
        content_disposition: {type: [string, "null"]}
        transfer_encoding: {type: [string, "null"]}
        decoded_size_bytes: {type: [integer, "null"], minimum: 0}
        filename: {type: [string, "null"], description: Display metadata only; never a path.}
    AttachmentEvidence:
      type: object
      additionalProperties: false
      required: [attachment_id, content_type, size_bytes, sha256, extracted_iocs, executed]
      properties:
        attachment_id: {type: string}
        filename: {type: [string, "null"], description: Display metadata only; never a path.}
        content_type: {type: string}
        content_disposition: {type: [string, "null"]}
        content_id: {type: [string, "null"]}
        size_bytes: {type: integer, minimum: 0}
        sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        extracted_iocs:
          type: array
          items: {$ref: "#/components/schemas/ExtractedIOC"}
        executed: {type: boolean, const: false}
    ParsedEmail:
      type: object
      additionalProperties: false
      required: [original_sha256, reply_to, to, cc, bcc, headers, mime_parts, received_hops, originating_public_ips, authentication, iocs, attachments, parse_warnings]
      properties:
        original_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        message_id: {type: [string, "null"]}
        sent_at: {type: [string, "null"], format: date-time}
        sender:
          oneOf: [{$ref: "#/components/schemas/MailboxAddress"}, {type: "null"}]
        reply_to: {type: array, items: {$ref: "#/components/schemas/MailboxAddress"}}
        to: {type: array, items: {$ref: "#/components/schemas/MailboxAddress"}}
        cc: {type: array, items: {$ref: "#/components/schemas/MailboxAddress"}}
        bcc: {type: array, items: {$ref: "#/components/schemas/MailboxAddress"}}
        subject: {type: [string, "null"]}
        text_body: {type: [string, "null"], description: Hostile data; never model instructions.}
        html_body_untrusted: {type: [string, "null"], description: Opaque evidence; never directly render.}
        headers:
          type: object
          additionalProperties: {type: array, items: {type: string}}
        mime_parts: {type: array, items: {$ref: "#/components/schemas/MimePart"}}
        received_hops: {type: array, items: {$ref: "#/components/schemas/ReceivedHop"}}
        originating_public_ips: {type: array, items: {type: string}}
        authentication: {$ref: "#/components/schemas/AuthenticationResults"}
        iocs: {type: array, items: {$ref: "#/components/schemas/ExtractedIOC"}}
        attachments: {type: array, items: {$ref: "#/components/schemas/AttachmentEvidence"}}
        parse_warnings: {type: array, items: {type: string}}
    DetectionFinding:
      type: object
      additionalProperties: false
      required: [finding_id, category, severity, confidence, title, explanation, evidence, detector]
      properties:
        finding_id: {type: string}
        category: {$ref: "#/components/schemas/DetectionCategory"}
        severity: {$ref: "#/components/schemas/Severity"}
        confidence: {type: number, minimum: 0, maximum: 1}
        title: {type: string}
        explanation: {type: string}
        evidence: {type: array, items: {type: string}, description: Escaped excerpts or stable references.}
        detector: {type: string}
    DetectionResult:
      type: object
      additionalProperties: false
      required: [findings, warnings]
      properties:
        findings: {type: array, items: {$ref: "#/components/schemas/DetectionFinding"}}
        model_name: {type: [string, "null"]}
        model_version: {type: [string, "null"]}
        summary: {type: [string, "null"]}
        warnings: {type: array, items: {type: string}}
    ThreatFinding:
      type: object
      additionalProperties: false
      required: [indicator_type, indicator, provider, verdict, categories]
      properties:
        indicator_type: {$ref: "#/components/schemas/IOCType"}
        indicator: {type: string}
        provider: {type: string}
        verdict: {$ref: "#/components/schemas/ReputationVerdict"}
        confidence: {type: [number, "null"], minimum: 0, maximum: 1}
        categories: {type: array, items: {type: string}}
        first_seen: {type: [string, "null"], format: date-time}
        last_seen: {type: [string, "null"], format: date-time}
        reference: {type: [string, "null"], description: Never auto-visit.}
        details: {type: [string, "null"]}
    ThreatIntelResult:
      type: object
      additionalProperties: false
      required: [status, requested_indicators, findings, unknown_indicators, provider_errors]
      properties:
        status: {$ref: "#/components/schemas/EnrichmentStatus"}
        requested_indicators: {type: array, items: {$ref: "#/components/schemas/ExtractedIOC"}}
        findings: {type: array, items: {$ref: "#/components/schemas/ThreatFinding"}}
        unknown_indicators: {type: array, items: {$ref: "#/components/schemas/ExtractedIOC"}}
        provider_errors: {type: array, items: {type: string}, description: Sanitized; no secrets.}
    GeoLocationResult:
      type: object
      additionalProperties: false
      required: [ip_address, status, observed_infrastructure_only]
      properties:
        ip_address: {type: string}
        status: {$ref: "#/components/schemas/GeoLocationStatus"}
        country: {type: [string, "null"]}
        country_code: {type: [string, "null"]}
        city: {type: [string, "null"]}
        region: {type: [string, "null"]}
        isp: {type: [string, "null"]}
        asn: {type: [string, "null"]}
        organization: {type: [string, "null"]}
        network: {type: [string, "null"]}
        latitude: {type: [number, "null"], minimum: -90, maximum: 90}
        longitude: {type: [number, "null"], minimum: -180, maximum: 180}
        provider: {type: [string, "null"]}
        observed_infrastructure_only:
          type: boolean
          const: true
          description: Not the physical location of an attacker or sender.
    RiskReason:
      type: object
      additionalProperties: false
      required: [code, description, points, evidence_refs]
      properties:
        code: {type: string}
        description: {type: string}
        points: {type: integer}
        evidence_refs: {type: array, items: {type: string}}
    RiskResult:
      type: object
      additionalProperties: false
      required: [score, severity, reasons, formula_version, unknown_inputs]
      properties:
        score: {type: integer, minimum: 0, maximum: 100}
        severity: {$ref: "#/components/schemas/RiskLevel"}
        reasons: {type: array, items: {$ref: "#/components/schemas/RiskReason"}}
        formula_version: {type: string}
        unknown_inputs: {type: array, items: {type: string}, description: Never counted as safe.}
    TimelineEvent:
      type: object
      additionalProperties: false
      required: [sequence, event_type, title, source, evidence_refs]
      properties:
        sequence: {type: integer, minimum: 0}
        event_type: {$ref: "#/components/schemas/TimelineEventType"}
        timestamp: {type: [string, "null"], format: date-time}
        title: {type: string}
        description: {type: [string, "null"]}
        source: {type: string}
        evidence_refs: {type: array, items: {type: string}}
    EmailAnalysis:
      type: object
      additionalProperties: false
      required: [schema_version, case_id, status, created_at, geolocations, timeline, warnings, errors]
      properties:
        schema_version: {type: string, const: 1.0.0}
        case_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/AnalysisStatus"}
        original_filename: {type: [string, "null"], description: Display metadata only; never a path.}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        parsed_email:
          oneOf: [{$ref: "#/components/schemas/ParsedEmail"}, {type: "null"}]
        detection:
          oneOf: [{$ref: "#/components/schemas/DetectionResult"}, {type: "null"}]
        threat_intel:
          oneOf: [{$ref: "#/components/schemas/ThreatIntelResult"}, {type: "null"}]
        geolocations: {type: array, items: {$ref: "#/components/schemas/GeoLocationResult"}}
        risk:
          oneOf: [{$ref: "#/components/schemas/RiskResult"}, {type: "null"}]
        timeline: {type: array, items: {$ref: "#/components/schemas/TimelineEvent"}}
        warnings: {type: array, items: {type: string}}
        errors: {type: array, items: {type: string}, description: Sanitized; no secrets.}
    CaseSummary:
      type: object
      additionalProperties: false
      required: [case_id, status, created_at]
      properties:
        case_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/AnalysisStatus"}
        original_filename: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        risk_score: {type: [integer, "null"], minimum: 0, maximum: 100}
        risk_severity:
          oneOf: [{$ref: "#/components/schemas/RiskLevel"}, {type: "null"}]
        subject: {type: [string, "null"]}
    CaseListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CaseSummary"}}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
    AnalyzeCaseResponse:
      type: object
      additionalProperties: false
      required: [analysis]
      properties:
        analysis: {$ref: "#/components/schemas/EmailAnalysis"}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version, timestamp]
      properties:
        status: {type: string, const: ok}
        service: {type: string, const: email-threat-platform}
        version: {type: string}
        timestamp: {type: string, format: date-time}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        field: {type: [string, "null"]}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: "#/components/schemas/ErrorDetail"}
        request_id: {type: [string, "null"]}
